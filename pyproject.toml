[project]
name = "evie"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.8.0",
    "edge-tts>=7.3.1",
    "google-genai>=3.3.0",
    "grpcio>=1.85.1",
    "pipecat-ai>=1.16.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
evie = "evie.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evie"]
